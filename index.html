<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Tracking</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { position: relative; width: min(100vw, 960px); }
  video, canvas { width: 100%; display: block; transform: scaleX(-1); } /* Selfie-Ansicht */
  canvas { position: absolute; inset: 0; height: 100%; }
  #status { padding: 12px 16px; }
</style>
</head>
<body>
<main>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">Lade Modell …</div>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const ctx = canvas.getContext("2d");
const draw = new DrawingUtils(ctx);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// Pinch = Daumenspitze (4) und Zeigefingerspitze (8) nah, relativ zur Handgröße (Handgelenk 0 bis Mittelfinger-Ansatz 9).
// Gibt die Mitte der beiden Spitzen in Pixeln zurück, sonst null.
const PINCH = 0.35;
function pinchPoint(hand, w, h) {
  const [t, i, wr, m] = [4, 8, 0, 9].map((n) => ({ x: hand[n].x * w, y: hand[n].y * h }));
  return Math.hypot(t.x - i.x, t.y - i.y) < PINCH * Math.hypot(wr.x - m.x, wr.y - m.y)
    ? { x: (t.x + i.x) / 2, y: (t.y + i.y) / 2 }
    : null;
}

// Quadrat, dessen linke und rechte Kantenmitte auf den Pinch-Punkten a und b liegen: Größe = Abstand, Drehung = Winkel.
function drawSquare(a, b) {
  const side = Math.hypot(b.x - a.x, b.y - a.y);
  ctx.save();
  ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2);
  ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
  ctx.strokeStyle = "#ffeb3b";
  ctx.lineWidth = 6;
  ctx.strokeRect(-side / 2, -side / 2, side, side);
  ctx.restore();
}

try {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 2,
  });

  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let lastTime = -1;
  (function loop() {
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      const { landmarks } = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const hand of landmarks) {
        draw.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS, { color: "#00e5ff", lineWidth: 4 });
        draw.drawLandmarks(hand, { color: "#ff4081", radius: 4 });
      }
      const pinches = landmarks.map((hand) => pinchPoint(hand, canvas.width, canvas.height)).filter(Boolean);
      if (pinches.length === 2) drawSquare(...pinches);
      status.textContent = pinches.length === 2 ? "Quadrat aktiv 🟨"
        : landmarks.length ? `${landmarks.length} Hand/Hände erkannt – Daumen + Zeigefinger zusammen, beide Hände`
        : "Zeig mir deine Hände ✋";
    }
    requestAnimationFrame(loop);
  })();
} catch (e) {
  status.textContent = "Fehler: " + e.message; // z.B. Kamera verweigert oder kein HTTPS
}
</script>
</body>
</html>
