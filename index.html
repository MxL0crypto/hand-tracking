<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Tracking</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { position: relative; width: min(100vw, 960px); }
  video, canvas { width: 100%; display: block; transform: scaleX(-1); } /* Selfie-Ansicht */
  canvas { position: absolute; inset: 0; height: 100%; }
  #status { padding: 12px 16px; }
  #clear { position: absolute; top: 12px; right: 12px; min-width: 96px; min-height: 48px; padding: 0 20px; font: inherit; color: #fff; background: rgba(0,0,0,.6); border: 2px solid #fff; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <button id="clear">Löschen</button>
  <div id="status">Lade Modell …</div>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");const ctx = canvas.getContext("2d");
const draw = new DrawingUtils(ctx);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// Pinch = Daumenspitze (4) und Zeigefingerspitze (8) nah, relativ zur Handgröße (Handgelenk 0 bis Mittelfinger-Ansatz 9).
// Hysterese: ein laufender Pinch hält bis PINCH_HOLD, damit er an der Schwelle nicht flackert.
// Gibt die Mitte der beiden Spitzen in Pixeln zurück, sonst null.
const PINCH = 0.35, PINCH_HOLD = 0.5;
function pinchPoint(hand, w, h, holding) {
  const [t, i, wr, m] = [4, 8, 0, 9].map((n) => ({ x: hand[n].x * w, y: hand[n].y * h }));
  return Math.hypot(t.x - i.x, t.y - i.y) < (holding ? PINCH_HOLD : PINCH) * Math.hypot(wr.x - m.x, wr.y - m.y)
    ? { x: (t.x + i.x) / 2, y: (t.y + i.y) / 2 }
    : null;
}

// Quadrat, dessen linke und rechte Kantenmitte auf den Pinch-Punkten a und b liegen: Größe = Abstand, Drehung = Winkel.
const squareOf = (a, b) => ({
  x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
  angle: Math.atan2(b.y - a.y, b.x - a.x), side: Math.hypot(b.x - a.x, b.y - a.y),
});

function drawSquare({ x, y, angle, side }, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = color;
  ctx.lineWidth = 16;
  ctx.strokeRect(-side / 2, -side / 2, side, side);
  ctx.restore();
}

// Loslassen = Quadrat wird platziert. Erst nach ein paar Bildern ohne Pinch, damit ein einzelner Tracking-Aussetzer nichts platziert.
const LOST_FRAMES = 5;
let active = null, lost = 0;
const placed = [];
document.getElementById("clear").onclick = () => { placed.length = 0; };
// One-Euro-Filter auf den Landmarks: ruhig bei langsamer Hand, kaum Verzögerung bei schneller.
// MIN_CUTOFF (Hz) kleiner = ruhiger; BETA größer = weniger Verzögerung bei Bewegung. Koordinaten sind 0..1.
const MIN_CUTOFF = 1, BETA = 10;
const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
function euro(s, v, dt) {
  if (!s) return { v, d: 0, raw: v };
  const d = s.d + alpha(1, dt) * ((v - s.raw) / dt - s.d);
  return { v: s.v + alpha(MIN_CUTOFF + BETA * Math.abs(d), dt) * (v - s.v), d, raw: v };
}
// shortcut: Filter hängen am Index der Hand; vertauscht MediaPipe die Reihenfolge, holt der Filter das in ein paar Bildern auf.
let filters = [], lastT = 0;
function filterHands(landmarks, t) {
  const dt = Math.max((t - lastT) / 1000, 1e-3);
  lastT = t;
  if (landmarks.length !== filters.length) filters = landmarks.map(() => []);
  return landmarks.map((hand, h) => hand.map((p, i) => {
    const [sx, sy] = (filters[h][i] ||= []);
    filters[h][i] = [euro(sx, p.x, dt), euro(sy, p.y, dt)];
    return { x: filters[h][i][0].v, y: filters[h][i][1].v };
  }));
}

// Winkel sind nach 180° gleich (Hände vertauscht), daher zum vorherigen Winkel hin umbrechen.
function unwrap(prev, next) {
  if (!prev) return next;
  const dAngle = ((((next.angle - prev.angle + Math.PI / 2) % Math.PI) + Math.PI) % Math.PI) - Math.PI / 2;
  return { ...next, angle: prev.angle + dAngle };
}

function update(now) {
  if (now) { active = unwrap(active, now); lost = 0; }
  else if (active && ++lost > LOST_FRAMES) { placed.push(active); active = null; }
}

try {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 2,
    // Standard ist 0.5: niedriger = Hände gehen seltener verloren (dafür selten Fehlerkennungen)
    minHandDetectionConfidence: 0.3,
    minHandPresenceConfidence: 0.3,
    minTrackingConfidence: 0.3,
  });

  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let lastTime = -1;
  (function loop() {
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      const t = performance.now();
      const landmarks = filterHands(landmarker.detectForVideo(video, t).landmarks, t);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const hand of landmarks) {
        draw.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS, { color: "#00e5ff", lineWidth: 4 });
        draw.drawLandmarks(hand, { color: "#ff4081", radius: 4 });
      }
      const pinches = landmarks.map((hand) => pinchPoint(hand, canvas.width, canvas.height, !!active)).filter(Boolean);
      update(pinches.length === 2 ? squareOf(...pinches) : null);
      placed.forEach((s) => drawSquare(s, "#69f0ae"));
      if (active) drawSquare(active, "#ffeb3b");
      status.textContent = pinches.length === 2 ? "Quadrat aktiv 🟨"
        : landmarks.length ? `${landmarks.length} Hand/Hände erkannt – Daumen + Zeigefinger zusammen, beide Hände`
        : "Zeig mir deine Hände ✋";
    }
    requestAnimationFrame(loop);
  })();
} catch (e) {
  status.textContent = "Fehler: " + e.message; // z.B. Kamera verweigert oder kein HTTPS
}
</script>
</body>
</html>
